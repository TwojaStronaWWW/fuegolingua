# Docker Compose dla lokalnego rozwoju i testowania PHP (Full-Stack Parity & ISO 27001)
# Zapewnia środowisko identyczne z hostingiem produkcyjnym (PHP 8.3 + Apache + mod_rewrite)
services:
  web:
    image: php:8.3-apache
    container_name: fuegolingua-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bezpieczeństwo ISO 27001: bindowanie wyłącznie do loopback (localhost)
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./api/sessions:/var/www/html/api/sessions:rw
      - ./api/rate_limits:/var/www/html/api/rate_limits:rw
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    command: >
      bash -c "a2enmod rewrite headers && apache2-foreground"
