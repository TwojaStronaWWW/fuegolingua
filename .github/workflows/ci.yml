name: CI & Quality Gate

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 1.2 Sprawdzenie pliku wejściowego (index.html lub index.php)
        run: |
          if [ ! -f index.html ] && [ ! -f index.php ]; then
            echo "❌ Brak pliku wejściowego index.html lub index.php!"
            exit 1
          fi

      - name: 1.3 Skaner sekretów Gitleaks i ochrona danych CSV (ISO 27001)
        run: |
          if git ls-files | grep -E "(\.env|config/secrets\.php|\.htpasswd|leads_.*\.csv)$"; then
            echo "❌ Wykryto plik z wrażliwymi danymi w repozytorium!"
            exit 1
          fi
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --config .gitleaks.toml --verbose --redact

      - name: 1.4 Walidacja składni PHP
        run: |
          if find . -type f -name "*.php" | grep -q .; then
            echo "Sprawdzanie składni PHP..."
            find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Brak plików PHP, pomijanie walidacji PHP."
          fi

      - name: 1.5 Konfiguracja środowiska Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1.6 Weryfikacja składni JavaScript
        if: hashFiles('package.json') != ''
        run: npm run check:syntax

      - name: 1.7 Weryfikacja integralności lokalnych linków i zasobów HTML
        run: |
          echo "🔍 Sprawdzanie referencji lokalnych linków..."
          for html_file in $(find . -maxdepth 2 -name "*.html" -not -path "*/node_modules/*"); do
            [ -f "$html_file" ] || continue
            base=$(dirname "$html_file")
            grep -oP '(?:src|href)="(?!https?://|#|javascript:|mailto:|tel:)([^"]+)"' "$html_file" 2>/dev/null | \
            sed 's/.*="\(.*\)"/\1/' | sed 's/[?#].*//' | \
            while read -r ref; do
              if [ ! -f "$base/$ref" ] && [ ! -d "$base/$ref" ]; then
                echo "❌ BRAK ZASOBU: $html_file → $ref"
                exit 1
              fi
            done
          done
          echo "✅ Wszystkie lokalne linki i zasoby istnieją."

      - name: 1.8 Uruchomienie testów jednostkowych (node:test)
        if: hashFiles('package.json') != ''
        run: npm test -- --experimental-test-coverage

  smoke-test:
    name: 2. Headless UI Smoke Test (Playwright)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2.3 Instalacja silnika Chromium i uruchomienie testu dymnego UI
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:smoke

      - name: 2.4 Zapis diagnostyki w razie awarii (smoke-diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: smoke-diagnostics/
          retention-days: 7

  lighthouse:
    name: 3. Audyt Lighthouse CI (a11y, SEO, Best Practices)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 3.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3.3 Audyt jakościowy Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'
