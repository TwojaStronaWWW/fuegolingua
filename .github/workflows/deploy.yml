name: "CI/CD Pipeline & Deployment: FuegoLingua.pl"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 1.2 Sprawdzenie pliku wejściowego (index.html)
        run: |
          if [ ! -f index.html ]; then
            echo "❌ Brak pliku wejściowego index.html!"
            exit 1
          fi

      - name: 1.3 Ochrona przed wyciekiem danych i sekretów
        run: |
          if git ls-files | grep -E "(\.env|config/secrets\.php|\.htpasswd|leads_.*\.csv)$"; then
            echo "❌ Wykryto plik z wrażliwymi danymi w repozytorium!"
            exit 1
          fi
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --config .gitleaks.toml --verbose --redact

      - name: 1.4 Walidacja składni PHP (jeśli występują pliki PHP)
        run: |
          if find . -type f -name "*.php" | grep -q .; then
            echo "Sprawdzanie składni plików PHP..."
            find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Brak plików PHP, pomijanie walidacji PHP."
          fi

      - name: 1.5 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1.6 Sprawdzenie poprawności syntaktycznej JavaScript
        run: npm run check:syntax

      - name: 1.7 Uruchomienie testów jednostkowych i raportu pokrycia (Coverage)
        run: npm run test:coverage

      - name: 1.8 Przeglądarkowy UI Smoke Test (Playwright Chromium)
        run: |
          npx --yes playwright@1.51.1 install --with-deps chromium
          node tests/smoke/ui-smoke.js

  audit:
    name: 2. Audyt jakościowy Lighthouse CI
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 2.3 Audyt jakościowy Lighthouse CI (a11y, SEO, Best Practices)
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'

  deploy:
    name: 3. Wdrożenie na serwer produkcyjny (LH)
    needs: [test, audit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Pobranie kodu repozytorium
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 3.1b Pre-Deploy Snapshot (Off-Site Backup danych z serwera LH.pl)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT || 40022 }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          mkdir -p /tmp/pre-deploy-snapshot
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "${FTP_PORT:-40022}" "sftp://$FTP_SERVER" << 'EOF'
          set sftp:auto-confirm yes
          set net:timeout 25
          set net:max-retries 2
          mirror --only-newer --ignore-time \
            --exclude-glob "api/sessions/*" \
            --exclude-glob "api/rate_limits/*" \
            "/home/platne/serwer417204/public_html/fuegolingua.pl/api" "/tmp/pre-deploy-snapshot/api" || true
          bye
          EOF
          tar -czf "/tmp/pre-deploy-snapshot-${GITHUB_SHA::7}.tar.gz" -C /tmp/pre-deploy-snapshot . || true

      - name: 3.1c Archiwizacja migawki Pre-Deploy (7 dni retencji)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: pre-deploy-snapshot-${{ github.sha }}
          path: /tmp/pre-deploy-snapshot-*.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: 3.2 Oczyszczenie zbędnych plików deweloperskich przed wysłaniem na serwer
        run: |
          rm -rf .git .github .gemini .githooks tests scripts docs .lighthouserc.json .gitleaks.toml .env.example .gitattributes .gitignore .editorconfig eslint.config.mjs .htmlhintrc docker-compose.yml package*.json

      - name: 3.3 Wdrożenie plików przez SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT || 40022 }}
          local_path: './* ./.htaccess'
          remote_path: '/home/platne/serwer417204/public_html/fuegolingua.pl'
          sftp_args: '-o ConnectTimeout=60'

      - name: 3.4 Czyszczenie pamięci podręcznej Cloudflare (opcjonalnie)
        if: env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "Wysyłanie żądania Purge Cache do API Cloudflare..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'